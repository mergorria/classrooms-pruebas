                        arco.style.filter = 'brightness(1)';

                    }
                }, 900);
            })();

                            setTimeout(()=&gt;this.closest('#asistenteConsejero').remove(),800);"
                    style="position: absolute; top: 2px; right: 6px; background: none; border: none; font-size: 15px; cursor: pointer; color: #666;">×</button>
            </div>
        </div>
        <script type="text/javascript">// <![CDATA[
            // 🪄 Animación + consejos secuenciales
            (function () {
                const asist = document.getElementById('asistenteConsejero');
                const globo = document.getElementById('globoConsejo');
                const siguienteBtn = document.getElementById('siguienteBtn');

                // entra después de 0.8 s
                setTimeout(() => {
                    asist.style.right = '20px';
                }, 800);

                // cambia automáticamente al segundo consejo tras 7s
                const autoNext = setTimeout(() => {
                    mostrarSegundo();
                }, 12000);

                // función que reemplaza el texto y elimina botón
                window.mostrarSegundo = function () {
                    clearTimeout(autoNext);
                    globo.style.opacity = '0';
                    setTimeout(() => {
                        globo.innerHTML = `💡 <b>Consejo:</b><br>
                Comenzá el recorrido desde el espacio <b>"Inicio"</b>.
                <button onclick="this.closest('#asistenteConsejero').style.right='-320px';
                                setTimeout(()=>this.closest('#asistenteConsejero').remove(),800);"
                style="position:absolute; top:2px; right:6px; background:none;
                        border:none; font-size:15px; cursor:pointer; color:#666;">×</button>`;
                        globo.style.opacity = '1';
                    }, 400);


                    setTimeout(() => {
                        asist.style.transition = 'right 1s ease';
                        asist.style.right = '-320px';
                        setTimeout(() => asist.remove(), 1000);
                    }, 12000);
                };
            })();
            // ]]></script>
    </div>
